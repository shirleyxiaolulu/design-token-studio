<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 12px; color: #333; padding: 16px; background: #fff;
    }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 11px; color: #999; margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; font-weight: 500; }
    textarea {
      width: 100%; height: 120px; border: 1.5px solid #ddd; border-radius: 8px;
      padding: 10px; font-size: 11px; font-family: 'SF Mono', monospace;
      resize: vertical; line-height: 1.5; color: #333;
      transition: border-color 0.15s;
    }
    textarea:focus { outline: none; border-color: #6533E8; }
    textarea.valid { border-color: #16a34a; }
    textarea.invalid { border-color: #dc2626; }
    .json-meta {
      font-size: 10px; color: #999; margin-top: 4px; line-height: 1.5;
      min-height: 30px;
    }
    .json-meta.parsed { color: #16a34a; }
    .btn {
      width: 100%; height: 38px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: #6533E8; color: #fff; }
    .btn-outline {
      background: #fff; color: #6533E8; border: 1.5px solid #6533E8;
      margin-top: 8px;
    }
    .divider { height: 1px; background: #eee; margin: 16px 0; }
    .status {
      font-size: 11px; color: #666; margin-top: 12px;
      padding: 8px 10px; background: #f8f8f8; border-radius: 6px;
      display: none; line-height: 1.5;
    }
    .status.show { display: block; }
    .status.success { color: #16a34a; background: #f0fdf4; }
    .status.error { color: #dc2626; background: #fef2f2; }
    .status.progress { color: #2563eb; background: #eff6ff; }
    .steps {
      font-size: 10px; color: #888; margin-top: 12px; line-height: 1.7;
      padding: 10px 12px; background: #fafafa; border-radius: 6px;
    }
    .steps strong { color: #555; }
    .steps ol { padding-left: 16px; }
    .field-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .mini-actions { display: flex; gap: 4px; }
    .mini-btn {
      height: 22px; padding: 0 8px; border: 1px solid #ddd; border-radius: 4px;
      background: #fff; color: #666; font-size: 10px; cursor: pointer; transition: all 0.15s;
    }
    .mini-btn:hover { border-color: #6533E8; color: #6533E8; }

    /* 2.0 反推审计 */
    .reverse-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .reverse-badge { font-size: 10px; color: #6533E8; background: #f1ecfd; padding: 1px 6px; border-radius: 8px; font-weight: 500; }
    .audit-result { margin-top: 12px; display: none; }
    .audit-result.show { display: block; }
    .audit-summary { font-size: 10px; color: #888; margin-bottom: 8px; line-height: 1.5; }
    .audit-flags { margin-bottom: 8px; }
    .flag { font-size: 11px; padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; line-height: 1.45; }
    .flag.warn { background: #fff7ed; color: #c2410c; }
    .flag.info { background: #eff6ff; color: #1d4ed8; }
    .audit-sec { border-top: 1px solid #eee; padding: 8px 0; }
    .audit-sec h4 { font-size: 11px; color: #555; margin-bottom: 6px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
    .audit-sec h4 .n { color: #999; font-weight: 500; }
    .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
    .sw { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.12); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { font-size: 10px; padding: 2px 6px; background: #f3f4f6; border-radius: 10px; color: #444; font-family: 'SF Mono', monospace; }
    .dupe { font-size: 10px; color: #9a3412; font-family: 'SF Mono', monospace; display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
    .dupe .s { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,0.12); }
    .scan-note { font-size: 10px; color: #999; margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>Design System v2</h2>
  <p class="subtitle">从 Web 端导入 JSON，同步变量并生成预览页</p>

  <div class="field">
    <div class="field-row">
      <label>粘贴 JSON（从 Web 端复制）</label>
      <div class="mini-actions">
        <button class="mini-btn" id="clearBtn" title="清除内容">清除</button>
      </div>
    </div>
    <textarea id="jsonInput" placeholder='在 Web 端点击 JSON 标签 → 复制当前内容 → 粘贴到这里'></textarea>
    <div class="json-meta" id="jsonMeta">等待粘贴 JSON...</div>
  </div>

  <button class="btn btn-primary" id="generateBtn" disabled>生成预览页</button>
  <button class="btn btn-outline" id="syncBtn" disabled>同步 Figma 变量</button>

  <div class="status" id="status"></div>

  <div class="divider"></div>

  <div class="steps">
    <strong>使用流程</strong>
    <ol>
      <li>在 Web 端调好主色、模式、字体等参数</li>
      <li>选择 JSON 导出，点击「复制当前内容」</li>
      <li>回到 Figma 打开此插件，粘贴 JSON</li>
      <li>点击「同步变量」更新所有 Figma Variables</li>
      <li>需要时点击「生成预览页」创建可视文档</li>
    </ol>
  </div>

  <div class="divider"></div>

  <div class="reverse-section">
    <div class="reverse-title">反推设计规范 <span class="reverse-badge">实验 · 2.0</span></div>
    <p class="subtitle" style="margin-top:4px; margin-bottom:10px;">选中画板/图层 → 扫描已用样式，生成审计报告（阶段①，只读不改文件）</p>
    <button class="btn btn-outline" id="auditBtn" style="margin-top:0;">扫描选中内容 · 生成审计</button>
    <div class="audit-result" id="auditResult"></div>
  </div>

  <script>
    const jsonInput = document.getElementById('jsonInput');
    const jsonMeta = document.getElementById('jsonMeta');
    const syncBtn = document.getElementById('syncBtn');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const auditBtn = document.getElementById('auditBtn');
    const auditResult = document.getElementById('auditResult');

    let parsedData = null;

    // Clear button
    document.getElementById('clearBtn').addEventListener('click', function() {
      jsonInput.value = '';
      parsedData = null;
      jsonInput.className = '';
      jsonMeta.className = 'json-meta';
      jsonMeta.textContent = '等待粘贴 JSON...';
      syncBtn.disabled = true;
      generateBtn.disabled = true;
      status.className = 'status';
      jsonInput.focus();
    });

    jsonInput.addEventListener('input', () => {
      const raw = jsonInput.value.trim();
      if (!raw) {
        parsedData = null;
        jsonInput.className = '';
        jsonMeta.className = 'json-meta';
        jsonMeta.textContent = '等待粘贴 JSON...';
        syncBtn.disabled = true;
        generateBtn.disabled = true;
        return;
      }

      try {
        const data = JSON.parse(raw);
        parsedData = normalizeData(data);
        if (!parsedData) throw new Error('无法识别的 JSON 结构');

        jsonInput.className = 'valid';
        jsonMeta.className = 'json-meta parsed';
        var modeLabel = parsedData.defaultMode === 'light' ? 'Light' : 'Dark';
        jsonMeta.textContent = `✓ ${parsedData.name} · ${modeLabel} · v${parsedData.version} · 颜色 ${parsedData.colorCount} · 尺寸 ${parsedData.dimCount}`;
        if (parsedData.dimCount === 0) jsonMeta.textContent += ' ⚠️ 尺寸变量为0，请检查JSON格式';
        syncBtn.disabled = false;
        generateBtn.disabled = false;
      } catch (e) {
        parsedData = null;
        jsonInput.className = 'invalid';
        jsonMeta.className = 'json-meta';
        jsonMeta.textContent = `✗ JSON 解析失败: ${e.message}`;
        syncBtn.disabled = true;
        generateBtn.disabled = true;
      }
    });

    function normalizeData(data) {
      // Format 1: Web 端完整导出 { name, platform, version, seed, tokens }
      if (data.tokens && data.seed) {
        const colorTokens = {};
        const dimTokens = {};
        const tokens = data.tokens;

        for (const [key, token] of Object.entries(tokens)) {
          const figmaName = token.figma?.variable || key.replaceAll('.', '/');
          const tier = token.tier || 'primitive';

          if (token.type === 'color' && token.value && typeof token.value === 'object') {
            // Resolve alias references
            let lightVal = token.value.light;
            let darkVal = token.value.dark;

            // Resolve {xxx.light} alias pattern
            const resolveAlias = (val, mode) => {
              const match = typeof val === 'string' ? val.match(/^\{(.+)\.(light|dark)\}$/) : null;
              if (match && tokens[match[1]]) {
                return resolveAlias(tokens[match[1]].value[match[2]], match[2]);
              }
              return val;
            };
            lightVal = resolveAlias(lightVal, 'light');
            darkVal = resolveAlias(darkVal, 'dark');

            if (typeof lightVal === 'string' && typeof darkVal === 'string') {
              colorTokens[key] = { figmaName, tier, light: lightVal, dark: darkVal, usage: token.usage || '' };
            }
          } else if (['dimension', 'number', 'fontFamily'].includes(token.type)) {
            const value = typeof token.value === 'object' ? token.value : token.value;
            // Carry typography metadata (role/weight/lineHeight) through so the
            // plugin derives text styles + the spec page from the export.
            dimTokens[key] = { figmaName, tier, value, type: token.type, usage: token.usage || '', role: token.role, weight: token.weight, lineHeight: token.lineHeight };
          } else if (token.type === 'shadow') {
            // Shadow tokens are complex objects — store for preview but skip variable sync
            dimTokens[key] = { figmaName, tier, value: token.value, type: 'shadow', usage: token.usage || '' };
          }
        }

        return {
          name: data.name || data.seed.specName || '未命名规范',
          platform: data.platform || data.seed.platform || 'ios-app',
          defaultMode: (data.seed && data.seed.defaultMode) || 'dark',
          version: data.version || 'draft',
          seed: data.seed,
          colorTokens,
          dimTokens,
          colorCount: Object.keys(colorTokens).length,
          dimCount: Object.keys(dimTokens).length,
        };
      }

      // Format 2: 简化格式 { colorTokens, dimTokens }
      if (data.colorTokens) {
        return {
          name: data.name || '未命名规范',
          platform: data.platform || 'ios-app',
          defaultMode: data.defaultMode || (data.seed && data.seed.defaultMode) || 'dark',
          version: data.version || 'draft',
          seed: data.seed || null,
          colorTokens: data.colorTokens,
          dimTokens: data.dimTokens || {},
          colorCount: Object.keys(data.colorTokens).length,
          dimCount: Object.keys(data.dimTokens || {}).length,
        };
      }

      return null;
    }

    syncBtn.addEventListener('click', () => {
      if (!parsedData) return;
      syncBtn.disabled = true;
      generateBtn.disabled = true;
      showStatus('正在同步变量...', 'progress');
      parent.postMessage({ pluginMessage: { type: 'sync', data: parsedData } }, '*');
    });

    generateBtn.addEventListener('click', () => {
      if (!parsedData) return;
      syncBtn.disabled = true;
      generateBtn.disabled = true;
      showStatus('正在生成预览页...（约 10 秒）', 'progress');
      parent.postMessage({ pluginMessage: { type: 'generate', data: parsedData } }, '*');
    });

    // 2.0 反推 · 阶段①：扫描选中内容生成审计
    auditBtn.addEventListener('click', () => {
      auditResult.className = 'audit-result';
      auditResult.innerHTML = '';
      showStatus('正在扫描选中内容...', 'progress');
      parent.postMessage({ pluginMessage: { type: 'audit' } }, '*');
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg.type === 'result') {
        showStatus(`✅ ${msg.message}`, 'success');
        syncBtn.disabled = false;
        generateBtn.disabled = false;
      } else if (msg.type === 'error') {
        showStatus(`❌ ${msg.message}`, 'error');
        syncBtn.disabled = false;
        generateBtn.disabled = false;
      } else if (msg.type === 'progress') {
        showStatus(`⏳ ${msg.message}`, 'progress');
      } else if (msg.type === 'audit-result') {
        auditResult.innerHTML = renderAudit(msg.report);
        auditResult.className = 'audit-result show';
        showStatus('✅ 审计完成（只读，未改动文件）', 'success');
      }
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function renderAudit(r) {
      var c = r.counts;
      var h = '';
      h += '<div class="audit-summary">扫描 ' + c.nodes + ' 个图层 · 填充 ' + c.fills + ' · 描边 ' + c.strokes + ' · 文本 ' + c.texts + ' · 圆角 ' + c.radii + ' · 阴影 ' + c.shadows + ' · 间距 ' + c.spacings + '</div>';
      if (r.truncated) h += '<div class="flag warn">图层过多，仅扫描了前 ' + c.nodes + ' 个，结果为部分样本</div>';
      h += '<div class="audit-flags">';
      r.flags.forEach(function (f) { h += '<div class="flag ' + f.level + '">' + escapeHtml(f.text) + '</div>'; });
      h += '</div>';

      // 颜色
      h += '<div class="audit-sec"><h4>颜色 <span class="n">' + r.colors.uniqueCount + ' 种 → ' + r.colors.clusterCount + ' 组</span></h4>';
      h += '<div class="swatches">' + r.colors.top.map(function (t) {
        return '<div class="sw" title="' + t.value + ' ×' + t.count + '" style="background:' + t.value + '"></div>';
      }).join('') + '</div>';
      if (r.colors.nearDupes.length) {
        h += '<div class="scan-note">几乎重复（ΔE&lt;2.5）：</div>';
        h += r.colors.nearDupes.slice(0, 8).map(function (d) {
          return '<div class="dupe"><span class="s" style="background:' + d.a + '"></span>' + d.a + ' ≈ <span class="s" style="background:' + d.b + '"></span>' + d.b + ' （ΔE ' + d.deltaE + '）</div>';
        }).join('');
      }
      h += '</div>';

      // 字体
      if (r.type.sizeCount) {
        h += '<div class="audit-sec"><h4>字体 <span class="n">' + r.type.sizeCount + ' 档字号 · ' + r.type.families.length + ' 家族</span></h4>';
        h += '<div class="chips">' + r.type.sizes.map(function (t) { return '<span class="chip">' + t.value + 'px·' + t.count + '</span>'; }).join('') + '</div>';
        if (r.type.families.length) h += '<div class="scan-note">字体：' + r.type.families.map(function (f) { return escapeHtml(f.value) + '(' + f.count + ')'; }).join('、') + '</div>';
        h += '</div>';
      }
      // 圆角
      if (r.radius.uniqueCount) {
        h += '<div class="audit-sec"><h4>圆角 <span class="n">' + r.radius.uniqueCount + ' 种</span></h4><div class="chips">' +
          r.radius.values.map(function (t) { return '<span class="chip">' + t.value + '·' + t.count + '</span>'; }).join('') + '</div></div>';
      }
      // 阴影
      if (r.shadow.uniqueCount) {
        h += '<div class="audit-sec"><h4>阴影 <span class="n">' + r.shadow.uniqueCount + ' 种</span></h4><div class="chips">' +
          r.shadow.list.map(function (t) { return '<span class="chip" title="' + escapeHtml(t.value) + '">×' + t.count + '</span>'; }).join('') + '</div></div>';
      }
      // 间距
      if (r.spacing.uniqueCount) {
        h += '<div class="audit-sec"><h4>间距 <span class="n">' + r.spacing.uniqueCount + ' 种</span></h4><div class="chips">' +
          r.spacing.values.map(function (t) {
            var off = (Number(t.value) % 4) !== 0;
            return '<span class="chip" style="' + (off ? 'background:#fff7ed;color:#c2410c;' : '') + '">' + t.value + '·' + t.count + '</span>';
          }).join('') + '</div>';
        if (r.spacing.offGrid.length) h += '<div class="scan-note">橙色 = 不在 4px 网格</div>';
        h += '</div>';
      }
      return h;
    }

    function showStatus(text, cls) {
      status.textContent = text;
      status.className = 'status show' + (cls ? ` ${cls}` : '');
    }
  </script>
</body>
</html>
